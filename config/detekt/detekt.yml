# Configuracion de detekt — se aplica SOBRE el ruleset por defecto
# (buildUponDefaultConfig = true en la convencion de calidad: build-logic/.../AndroidQuality.kt).
#
# Para regenerar el fichero por defecto completo:
#   ./gradlew detektGenerateConfig
#
# La validacion esta activa: una clave que la version instalada de detekt no conoce (un renombre entre alphas,
# un umbral de la 1.23) hace fallar detekt en vez de ignorarse y dejar el umbral por defecto. Las claves de
# abajo son las de la 2.0 (allowed*). Al subir de alpha, si la validacion falla, corrige la clave del yml.
#
# LongParameterList y el resto de reglas que resuelven tipos no corren en la tarea `detekt`: las ejecutan
# detektMain y detektTest, que forman parte de codeQuality.
config:
  validation: true

# --- Naming: estandares Kotlin + soporte Jetpack Compose -------------------
# Las funciones @Composable y @Preview usan PascalCase (estandar de Compose),
# lo cual choca con FunctionNaming. Se ignoran esas anotaciones en vez de
# desactivar la regla, para seguir validando el resto de funciones.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable', 'Preview']
  TopLevelPropertyNaming:
    # Constantes de tema/diseno (val LightColors, etc.) en Compose.
    ignoreAnnotated: ['Composable']

complexity:
  LongMethod:
    allowedLines: 80
  LongParameterList:
    allowedFunctionParameters: 8
    allowedConstructorParameters: 8
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    allowedFunctionsPerFile: 30
    allowedFunctionsPerClass: 30

# --- Style: el FORMATO lo gobierna ktlint (single source of truth) ----------
# Para no reportar dos veces lo mismo, se desactivan en detekt las reglas que
# ya cubre ktlint (longitud de linea, wildcard imports, newline final...).
style:
  AbstractClassCanBeInterface:
    ignoreAnnotated: ['Module']
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  WildcardImport:
    active: false
  NewLineAtEndOfFile:
    active: false
