# SDK con el que Robolectric emula Android en los tests JVM.
#
# Sin esta línea Robolectric usa el targetSdk del módulo y falla en cuanto el proyecto apunta a una
# API más nueva que la última que Robolectric soporta:
#   IllegalArgumentException: Package targetSdkVersion=37 > maxSdkVersion=36
#
# Súbelo a la par que la versión de Robolectric en gradle/libs.versions.toml.
sdk=36
