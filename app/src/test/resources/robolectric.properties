# SDK con el que Robolectric emula Android en los tests JVM. Va a la par del targetSdk (37).
#
# Se fija aquí para subirlo a propósito: sin esta línea Robolectric toma el targetSdk del módulo y,
# si este sube antes de que Robolectric soporte esa API, todos los tests fallan con
#   IllegalArgumentException: Package targetSdkVersion=N > maxSdkVersion=M
#
# La API 37 necesita Robolectric >= 4.17 y espresso-core >= 3.7.0 (ver app/build.gradle.kts).
sdk=37
